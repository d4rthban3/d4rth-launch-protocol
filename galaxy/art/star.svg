<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff4b8"/>
      <stop offset="50%" stop-color="#ffb833"/>
      <stop offset="78%" stop-color="#ff6b00"/>
      <stop offset="95%" stop-color="#cc2200"/>
      <stop offset="100%" stop-color="#440000"/>
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="rgba(255, 180, 50, 0.4)"/>
      <stop offset="85%" stop-color="rgba(255, 100, 0, 0.1)"/>
      <stop offset="100%" stop-color="rgba(255, 60, 0, 0)"/>
    </radialGradient>
  </defs>
  <!-- Outer Corona -->
  <circle cx="100" cy="100" r="96" fill="url(#corona)"/>
  <!-- Stellar Core -->
  <circle cx="100" cy="100" r="76" fill="url(#starGlow)"/>
  <!-- Inner White-hot Core -->
  <circle cx="100" cy="100" r="32" fill="#ffffff" opacity="0.85"/>
</svg>
